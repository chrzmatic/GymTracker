<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ícone do app: um halter simples sobre o fundo escuro do tema.
  Desenhado à mão em SVG para não depender de nenhuma imagem externa, e
  usado como fonte para gerar os PNGs que o iOS exige.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0e1116"/>
  <g fill="none" stroke="#4f8cff" stroke-linecap="round" stroke-width="28">
    <!-- barra -->
    <line x1="150" y1="256" x2="362" y2="256"/>
  </g>
  <g fill="#4f8cff">
    <!-- anilhas internas -->
    <rect x="122" y="186" width="34" height="140" rx="16"/>
    <rect x="356" y="186" width="34" height="140" rx="16"/>
    <!-- anilhas externas -->
    <rect x="78" y="212" width="30" height="88" rx="14" opacity="0.65"/>
    <rect x="404" y="212" width="30" height="88" rx="14" opacity="0.65"/>
  </g>
</svg>
